---
# TODO implementation: no reference in @canonical/dataviews-react
# It is to be implemented by DataViews.QueryBar in @canonical/dataviews-react.
# The root is the bar's row: the query input, then the quick filters the application
# passes. Below its container's narrow width the bar hides the chips and keeps the
# QueryInput's search entry and clear button, beside a summary button that opens the
# sheet; the switch is a container query, which the DSL does not express.
node:
  uri: global_dataviews.component.query_bar
  styles:
    layout.type: flex
    layout.wrap: wrap
    layout.align: center
    layout.container: inline-size
    spacing.gap: dimension.200
  edges:
    - node:
        # The field shell: the search icon, the entry, the clear button, the focus ring and
        # the suggestions. The bar fills it: the chips, from its clauses, with a draft chip
        # whose Entry takes the part being typed; the options for that part; and the clear
        # action, which clears the filters and the search, and is a link only when the
        # navigation adapter provides href. With such an adapter, before scripts run, the bar
        # wraps it in a native search form whose hidden inputs carry the applied filters, so
        # a search keeps them. On narrow containers its chips are hidden; the sheet lists
        # them.
        uri: global_dataviews.subcomponent.query_input
      relation:
        cardinality: "1"
    - node:
        # Wide containers only, and only when the navigation adapter provides href: the
        # full filters GET form in an inline <details> disclosure, whose submit is Apply,
        # the baseline before scripts run. It carries the search text `q` as a hidden
        # input, so Apply keeps the search. The form's fields have no block in the graph.
        role: filters disclosure
      relation:
        cardinality: "0..1"
    - node:
        # Narrow containers only: "Filters" with the number of applied clauses, named
        # "Filters, 2 applied". It opens the sheet with commandfor and
        # command="show-modal", so it works before scripts run.
        uri: global.component.button
        edges:
          - node:
              role: summary label
            relation:
              cardinality: "1"
              slotName: label
          - node:
              # The count in words from the bar's messages ("2 applied"), visually hidden,
              # so the name reads "Filters, 2 applied".
              role: applied words
            relation:
              cardinality: "0..1"
              slotName: label
          - node:
              # aria-hidden: the applied words carry the count.
              uri: global.component.badge
            relation:
              # Present while a clause applies.
              cardinality: "0..1"
              slotName: label
      relation:
        cardinality: "0..1"
    - node:
        # The narrow form, a sheet: A native <dialog> opened modal, filling the viewport.
        # The summary button opens it with command="show-modal" and the close button closes
        # it with command="close", so it opens before scripts run. It closes natively on
        # Escape and the back gesture, through the dialog's close request, and adds no
        # history entry. It keeps no state: with scripts each change commits to the query
        # state as it is made. It sits on Surface Modal, which resolves its surface channel.
        role: sheet
        styles:
          layout.type: flex
          layout.direction: column
          # A modal <dialog> is capped short of the viewport and given a border and auto
          # margins by the user agent; these undo that, so the sheet fills the viewport.
          size.width: 100%
          size.height: 100%
          size.max.width: 100%
          size.max.height: 100%
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          spacing.external.inline.start: 0
          spacing.external.inline.end: 0
          appearance.border.style: none
          appearance.background: [surface.color.background, color.background]
          typography.color: [surface.color.text, color.text]
          spacing.internal.block.start: 0
          spacing.internal.block.end: 0
          spacing.internal.inline.start: 0
          spacing.internal.inline.end: 0
        edges:
          - node:
              # One form around the header, the body and the footer, so the footer's Apply
              # submits it: a GET form when the navigation adapter provides href, a plain
              # container otherwise. The GET form carries the search text `q` as a hidden
              # input, so Apply keeps the search.
              role: form
              styles:
                layout.type: flex
                layout.direction: column
                layout.flex.grow: 1
                size.min.height: 0
              edges:
                - node:
                    role: header
                    styles:
                      layout.type: flex
                      layout.align: center
                      layout.justify: space-between
                      spacing.internal.block.start: dimension.200
                      spacing.internal.block.end: dimension.200
                      spacing.internal.inline.start: dimension.200
                      spacing.internal.inline.end: dimension.200
                      appearance.border.style: solid
                      appearance.border.width: 0
                      appearance.border.bottom.width: dimension.stroke.thickness.medium
                      appearance.border.bottom.color: color.border.muted
                    edges:
                      - node:
                          role: title
                          styles:
                            typography.font: typography.text.primary
                            typography.weight: typography.weight.medium
                        relation:
                          cardinality: "1"
                      - node:
                          # Closes the sheet with command="close", named "Close filters".
                          # Nothing is staged, so nothing is discarded. Icon-only; the graph
                          # has no icon button, so Button carries the icon.
                          uri: global.component.button
                          props:
                            icon: close
                        relation:
                          cardinality: "1"
                  relation:
                    cardinality: "1"
                - node:
                    role: body
                    styles:
                      layout.type: flex
                      layout.direction: column
                      layout.flex.grow: 1
                      layout.overflow.block: auto
                      spacing.gap: dimension.200
                      spacing.internal.block.start: dimension.200
                      spacing.internal.block.end: dimension.200
                      spacing.internal.inline.start: dimension.200
                      spacing.internal.inline.end: dimension.200
                    edges:
                      - node:
                          # Read-only chips: they pass onRemove or removeHref, and their
                          # Segments take no onActivate, so the Segments are plain text and
                          # each chip's one tab stop is its remove control. No roving host
                          # is needed here.
                          uri: global_dataviews.group.query_chips
                        relation:
                          cardinality: "0..1"
                      - node:
                          # "Add filter": absent before scripts run. Once they run, it walks
                          # field, operator and value as full-width lists inside the sheet,
                          # not as a popover, and commits its chip when the chip is
                          # complete.
                          uri: global.component.button
                        relation:
                          cardinality: "0..1"
                      - node:
                          # The filters' fields, inside the sheet's form. With scripts, each
                          # control commits to the query state as it changes. Their
                          # implementation has no block in the graph.
                          role: filters fields
                        relation:
                          cardinality: "1"
                  relation:
                    cardinality: "1"
                - node:
                    role: footer
                    styles:
                      layout.type: flex
                      layout.justify: end
                      spacing.gap: dimension.100
                      spacing.internal.block.start: dimension.200
                      spacing.internal.block.end: dimension.200
                      spacing.internal.inline.start: dimension.200
                      spacing.internal.inline.end: dimension.200
                      appearance.border.style: solid
                      appearance.border.width: 0
                      appearance.border.top.width: dimension.stroke.thickness.medium
                      appearance.border.top.color: color.border.muted
                    edges:
                      - node:
                          # Clear all: clears the filters only; the search stays. A link to
                          # the address of the query without its filters when the navigation
                          # adapter provides href.
                          uri: global.component.button
                        relation:
                          cardinality: "1"
                      - node:
                          # Once scripts run, "Show N results", N being the live result
                          # count derived from the query state, with its exactness ("Show
                          # 1,000+ results"); while no count is known it reads "Show
                          # results". It only closes the dialog (command="close"). Before
                          # they run, and only when the navigation adapter provides href,
                          # the GET form's Apply submit.
                          uri: global.component.button
                        relation:
                          cardinality: "1"
                      - node:
                          # A visually hidden, polite, atomic role="status" region inside
                          # the dialog, which stays in the accessibility tree while the page
                          # behind is inert. The bar announces the result count after each
                          # commit here while the sheet is open.
                          role: status region
                        relation:
                          cardinality: "1"
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
      relation:
        cardinality: "0..1"
    - node:
        # One per quick filter the application names. Quick filters may also be shown as
        # option words. When the navigation adapter provides href, its panel is a GET form
        # whose Apply submit carries the search text `q` and every other applied clause as
        # hidden inputs, so Apply changes only its own field.
        uri: global_dataviews.component.filter_button
      relation:
        cardinality: "0..*"
    - node:
        # The bar's warnings and errors: invalid input, a contradiction with its Merge
        # action, and refused clauses. Shown while the field has focus too.
        uri: global.subcomponent.field-error
        styles:
          layout.flex.basis: 100%
      relation:
        cardinality: "0..1"
    - node:
        # A visually hidden, polite, atomic role="status" region: the bar's announcer. While
        # the sheet is open, the page behind it is inert, so announcements go to the sheet's
        # own region instead.
        role: status region
      relation:
        cardinality: "1"
