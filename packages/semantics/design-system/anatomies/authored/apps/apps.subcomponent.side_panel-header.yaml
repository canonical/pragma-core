---
# Authored 2026-10-11 from @canonical/react-ds-app
# src/lib/SidePanel/common/Header/styles.css on .ds.side-panel-header and its
# child selectors (> .title, > .close). Supersedes the retired-notation cell
# the block carried: the title reads the heading-2 tier (not heading-4), the
# row is baseline-aligned, and the header carries the hairline that opens the
# scroll region.
node:
  uri: apps.subcomponent.side_panel-header
  styles:
    layout.type: flex
    layout.direction: row
    # Baseline-aligned: the close button sits on the title's baseline and the
    # browser lines the two up itself — nothing here needs to know where the
    # typography engine puts either baseline.
    layout.align: baseline
    # Never shrinks: only the content pane gives way.
    layout.flex.grow: 0
    layout.flex.shrink: 0
    layout.flex.basis: auto
    spacing.gap: dimension.200                    # --side-panel-header-gap, title to dismiss
    spacing.internal.block.start: dimension.200   # --side-panel-header-padding-block
    spacing.internal.block.end: dimension.200     # --side-panel-header-padding-block
    # The one inline padding --side-panel-padding-inline is shared with the
    # content and the footer, so title, text and actions align on the same
    # two edges — while the hairline below runs edge to edge across it.
    spacing.internal.inline.start: dimension.300
    spacing.internal.inline.end: dimension.300
    # Opens the scroll region, the counterpart of the footer's hairline. A
    # border on the header's own box, so it spans the full panel width while
    # the padding keeps the title in the text column. The colour is the
    # panel's --side-panel-color-border, declared once in the panel's :root
    # block, where it resolves to color.border.muted.
    appearance.border.style: solid
    appearance.border.width: dimension.stroke.thickness.medium
    appearance.border.bottom.color: color.border.muted
  edges:
    - node:
        role: title
        styles:
          layout.flex.grow: 1
          layout.flex.shrink: 1
          layout.flex.basis: auto
          # A span, not a heading element: a panel opens from anywhere in the
          # document outline, so no heading level would be right everywhere —
          # the title names the panel through aria-labelledby instead. Its
          # type is the heading-2 tier regardless; the implementation reads
          # every facet of --typography-heading-2-*, so the composite carries
          # them all here.
          typography.font: typography.heading.2
      relation:
        cardinality: "1"
        slotName: default
    - node:
        uri: global.component.button
        props:
          icon: close
        styles:
          layout.flex.grow: 0
          layout.flex.shrink: 0
          layout.flex.basis: auto
          # Button tightens its start padding when it carries an icon, which
          # leaves an icon-only one lopsided; both sides are equalised through
          # the component's custom-property API, as Modal's header does.
          spacing.internal.inline.start: dimension.100  # --button-padding-inline-start
          spacing.internal.inline.end: dimension.100    # --button-padding-inline-end
          # The implementation also sets importance="tertiary" on this Button.
          # That is not pinned: `importance` is a modifier family Button
          # consumes (ds:hasModifierFamily), not one of its ds:hasProperty
          # names, and a pin asserts a prop value.
      relation:
        cardinality: "0..1"      # hidden when the panel is undismissible
