---
# Authored 2026-09-13 from @canonical/react-ds-global-form
# src/lib/subcomponent/RadioInput/styles.css on .ds.form-radio. The atomic radio
# control: a circular native input with the design-system selection chrome,
# carrying no label — the host supplies it.
node:
  uri: global.subcomponent.radio_input
  styles:
    appearance.native: none
    layout.boxSizing: border-box
    # margin-inline reads --form-input-padding-inline, then
    # --component-padding-inline: neither is declared.
    # A 16px control: a fixed element size, deliberately NOT a baseline multiple.
    size.width: dimension.200
    size.height: dimension.200
    appearance.border.width: dimension.stroke.thickness.medium
    appearance.border.style: solid
    appearance.border.color: color.border
    appearance.radius: 50%
    # The unselected fill reads the surface channel so the control adapts to
    # OnSurface stepping, then the flat token.
    appearance.background: [surface.color.foreground.radio.unselected, color.foreground.radio.unselected]
    appearance.background@hover: color.foreground.radio.unselected.hover
    # Selected, the ring border takes the selected token; the dot itself is a
    # radial-gradient (selected at 40%, unselected from 41%), which no roster key
    # takes. Its first rank, --surface-color-foreground-radio-selected, is not
    # declared: the surface family mints channels for the checkmark and the
    # unselected fill only.
    appearance.border.color@selected: color.foreground.radio.selected
    appearance.border.color@focus: color.focusRing
    appearance.outline.style@focus: none
    appearance.border.color@disabled: color.border.disabled
    appearance.background@disabled: color.foreground.radio.unselected.disabled
    interaction.cursor: pointer
    interaction.cursor@disabled: not-allowed
    motion.property: background-color, border-color
    # Not bound: the transition duration reads --motion-duration-fast; the focus
    # ring is a box-shadow at color.focusRing; and a hovered selected radio
    # repaints the gradient from --hover--color-foreground-radio-selected, a
    # computed state variable that is not a symbol and would need a compound
    # state in any case.
