---
# Authored 2026-09-13 from @canonical/react-ds-global
# src/lib/pattern/Modal/common/Footer/styles.css on .ds.modal-footer and its
# ::before rule.
node:
  uri: global.subcomponent.modal-footer
  styles:
    layout.type: flex
    layout.direction: row
    layout.align: center
    layout.justify: flex-end
    # Never shrink: only the content pane gives way.
    layout.flex.grow: 0
    layout.flex.shrink: 0
    layout.flex.basis: auto
    # Positions the inset rule below.
    layout.position: relative
    # The inline padding --modal-padding-inline is shared with the header and
    # the content, so the three sections align.
    spacing.gap: dimension.100                    # --modal-footer-gap, the inline gap between actions
    spacing.internal.block.start: dimension.200   # --modal-footer-padding-block, a surface inset
    spacing.internal.block.end: dimension.200     # --modal-footer-padding-block, a surface inset
    spacing.internal.inline.start: dimension.300  # --modal-padding-inline, a surface inset
    spacing.internal.inline.end: dimension.300    # --modal-padding-inline, a surface inset
  edges:
    - node:
        uri: global.component.button
      relation:
        cardinality: "0..*"
        slotName: default
    - node:
        role: divider rule
        styles:
          layout.position: absolute
          # Inset to the footer's own inline padding so it aligns with the
          # actions and the content. inset-block-start is a raw 0, which the
          # block-axis offset keys take a token only for.
          layout.offset.inline.start: dimension.300
          size.block: dimension.stroke.thickness.medium
          appearance.background: color.border.muted
          # The second of the two rules bounding the content. Drawn as ::before
          # rather than a border so it can be inset to the footer's inline
          # padding and align with the actions and the content.
      relation:
        cardinality: "1"
