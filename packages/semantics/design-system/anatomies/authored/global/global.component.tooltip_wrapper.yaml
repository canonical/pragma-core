---
# TODO implementation: no reference in @canonical/react-ds-global or react-ds-global-form
# A notation migration of the previous DSL (the Coda block "Tooltip.Wrapper"):
# structure and bindings kept, values migrated, dangling uri: references
# repaired. react-ds-global implements one Tooltip — the chip bound in
# ds:global.component.tooltip — and no wrapper variant.
node:
  uri: global.component.tooltip_wrapper
  edges:
    - node:
        role: surface
        styles:
          # Was `color/surface/tooltip`; no symbol declares
          # color.background.tooltip, so this is the declared background the
          # surface correspondence lands on. (The live Tooltip reads the
          # surface channel: [surface.color.background, color.background].)
          appearance.background: color.background
          layout.type: flex   # was stack
          layout.direction: column   # was vertical
          layout.align: start
          # Was `spacing.internal.vertical|horizontal: dimension/200` and
          # `spacing.gap: dimension/100`; the roster's internal keys are per
          # side, so the two axes become four.
          spacing.internal.block.start: dimension.200
          spacing.internal.block.end: dimension.200
          spacing.internal.inline.start: dimension.200
          spacing.internal.inline.end: dimension.200
          spacing.gap: dimension.100
        edges:
          - node:
              role: wrapper-item
            relation:
              cardinality: "0..*"
              slotName: default
      relation:
        cardinality: "1"
        slotName: default
    - node:
        # Was `ds:global.subcomponent:TooltipArrow`, which names no subject, so
        # the position is an anonymous role.
        role: arrow
        styles:
          # Was `color/surface/tooltip`, as above.
          appearance.background: color.background
      relation:
        cardinality: "0..1"
        slotName: arrow
