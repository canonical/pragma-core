---
# TODO implementation: no reference in @canonical/react-ds-global or react-ds-global-form
# Tone: a segment reads the modifier channels. The host sets the operator segment's
# Condition value; Inclusion, Match, Range and Presence route to the Information symbols.
# Exclusion takes the Information symbols too; its mark carries the negation.
# The invalid state binds the error symbols directly.
# Editing: the closed state vocabulary has no `editing`. A segment being edited is the
# segment chosen within its chip, so it takes @selected; a selected chip sets @selected on
# all its segments. Both take the same fill.
# Element: once scripts run, and when its chip has onSegmentActivate, a segment that is not
# being edited is a native <button>, so a click, Enter or Space activates it. Otherwise,
# and before scripts run, it is plain text. While it is edited it is a plain container
# holding the host's editor, so no interactive content ever sits inside a button. It draws
# no focus ring of its own: segment buttons exist only inside a roving context, where
# focus rests on a chip's first segment or on the edited one, and the chip's body draws
# one ring around the clause while focus is within it.
# Refused: the host sets Criticality Error on the chip and no Condition value on its
# segments, so the channels give every segment the error tone; the glyph shows on the
# first segment. Invalid: the segment at fault takes @invalid, which wins over the
# channels, and shows the glyph.
node:
  uri: global.subcomponent.segmented_chip-segment
  styles:
    layout.type: inline-flex
    layout.align: center
    # 24 by 24 px at least, whatever the text, so a one-glyph operator is a full target.
    size.min.width: dimension.300
    size.min.height: dimension.300
    layout.justify: center
    # A native <button> does not inherit the chip's font, so it is set here.
    typography.font: typography.text.secondary
    # 6 px, which no symbol declares. A joined chip pads 0.
    # --segmented-chip-segment-padding-inline
    spacing.internal.inline.start: 0.375rem
    spacing.internal.inline.end: 0.375rem
    spacing.internal.block.start: dimension.025
    spacing.internal.block.end: dimension.025
    interaction.cursor: text
    # A joined chip rebinds it. The secondary fills have no Surface positions yet, so the
    # fill does not follow the layer beneath the chip. --segmented-chip-segment-background
    appearance.background: [modifier.color.foreground.secondary, color.foreground.secondary]
    appearance.background@hover: color.foreground.secondary.hover
    # @selected is drawn from a data attribute, never aria-selected, which a button does
    # not support; selection reaches assistive technology through focus.
    appearance.background@selected: color.foreground.secondary.active
    appearance.background@disabled: color.foreground.secondary.disabled
    appearance.background@invalid: color.foreground.secondary.error
    # --segmented-chip-segment-text
    typography.color:
      - modifier.color.text.onForegroundSecondary
      - color.text.onForegroundSecondary
    typography.color@disabled: color.text.onForegroundSecondary.disabled
    typography.color@invalid: color.text.onForegroundSecondary.error
  edges:
    - node:
        # Present on the segment at fault of an invalid chip, and on the first segment of
        # a refused chip, only.
        # The glyph follows the modifier, as the colours do: Criticality Error's own glyph
        # is `error`, and @canonical/styles maps each Criticality value to the glyph of
        # the same name. The token graph has no modifier channel for a glyph, so the DSL
        # cannot read it from the modifier; the Error value's glyph is written here until
        # that channel exists.
        uri: global.component.icon
        props:
          icon: error
        styles:
          size.width: dimension.200
          size.height: dimension.200
          typography.color: color.icon.onForegroundSecondary.error
          spacing.external.inline.end: dimension.050
      relation:
        cardinality: "0..1"
    - switch:
        # While the segment is edited, the host's editor replaces its text, and the
        # segment is no longer a button.
        on: override
        cases:
          - node:
              role: segment text
              styles:
                typography.overflow: ellipsis
          - uri: $custom
      relation:
        cardinality: "1"
        slotName: editor
