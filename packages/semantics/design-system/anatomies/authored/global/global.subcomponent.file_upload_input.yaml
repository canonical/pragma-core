---
# Authored 2026-09-13 from @canonical/react-ds-global-form
# src/lib/subcomponent/FileUploadInput/styles.css on .ds.input.file-upload and
# its child selectors (> .drop-zone, its hidden native input, > .file-list and
# the five parts of a .file-item), with the tokens it reads from src/index.css.
# The stylesheet corrects the notation: the file items live in a list container,
# not directly under the root.
node:
  uri: global.subcomponent.file_upload_input
  styles:
    layout.type: flex
    layout.direction: column
    # The gap reads --form-group-gap, then --space-100 (and --density-space-sm
    # inside a density scope): none of the three is declared.
  edges:
    - node:
        role: drop area
        styles:
          layout.type: flex
          layout.align: center
          layout.justify: center
          layout.boxSizing: border-box
          appearance.border.width: dimension.stroke.thickness.medium
          appearance.border.style: dashed
          appearance.border.color: color.border
          appearance.radius: dimension.radius.small
          appearance.background: color.foreground.input
          typography.color: color.text.muted
          interaction.cursor: pointer
          motion.property: border-color, background-color
          # The hover fill reads --hover--color-foreground-input first, a computed
          # state variable that no stratum declares as a symbol.
          appearance.background@hover: color.foreground.input.hover
          appearance.border.color@focus: color.focusRing
          # A `.danger` field — a failed validation — repaints the dashed border.
          appearance.border.color@invalid: color.border.error
          appearance.outline.style@focus: none
          appearance.background@disabled: color.foreground.input.disabled
          interaction.cursor@disabled: not-allowed
          # Not bound, and why:
          # - min-height is a calc() over dimension.400 (128px), and the padding
          #   a calc() that subtracts the border thickness from
          #   --form-input-padding-block so the total stays on the baseline grid;
          # - the inline padding reads --form-input-padding-inline, then
          #   --component-padding-inline: neither is declared;
          # - the focus ring is a box-shadow at --form-focus-ring-color, and the
          #   disabled text colour reads the computed --disabled--color-text;
          # - the transition duration reads --motion-duration-fast, undeclared;
          # - `.drag-over` takes the focus border and the hover fill, which is a
          #   variant rather than one of the states.
        edges:
          - node:
              role: native file input
              styles:
                # Visually hidden but kept in the accessibility tree: the drop
                # area is the affordance, the input is the control.
                layout.position: absolute
                size.width: 1px
                size.height: 1px
                layout.overflow: hidden
                typography.whiteSpace: nowrap
                appearance.border.width: 0
            relation:
              cardinality: "1"
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: file list
        styles:
          layout.listStyle: none
          layout.type: flex
          layout.direction: column
          spacing.internal.block.start: 0
          spacing.internal.block.end: 0
          spacing.internal.inline.start: 0
          spacing.internal.inline.end: 0
          # `margin: 0` zeroes all four sides of the list.
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          spacing.external.inline.start: 0
          spacing.external.inline.end: 0
          # The gap reads --form-group-gap, undeclared, as the root's does.
        edges:
          - node:
              role: file item
              styles:
                layout.type: flex
                layout.align: baseline
                layout.boxSizing: border-box
                appearance.border.width: dimension.stroke.thickness.medium
                appearance.border.style: solid
                appearance.border.color: color.border
                appearance.radius: dimension.radius.small
                appearance.background: color.foreground.input
                spacing.internal.block.start: 0
                spacing.internal.block.end: 0
                # The gap reads --form-field-inline-gap and the inline padding
                # --form-input-padding-inline, and the height
                # --form-input-height: none of their chains resolves.
              edges:
                - node:
                    role: file preview
                    styles:
                      size.width: dimension.400
                      size.height: dimension.400
                      layout.objectFit: cover
                      appearance.radius: dimension.radius.small
                      layout.flex.shrink: 0
                  relation:
                    cardinality: "0..1"
                - node:
                    role: file name
                    styles:
                      layout.flex.grow: 1
                      layout.flex.shrink: 1
                      layout.flex.basis: 0%
                      size.min.width: 0
                      layout.overflow: hidden
                      typography.overflow: ellipsis
                      typography.whiteSpace: nowrap
                  relation:
                    cardinality: "1"
                - node:
                    role: file size
                    styles:
                      typography.color: color.text.muted
                      typography.whiteSpace: nowrap
                  relation:
                    cardinality: "1"
                - node:
                    role: file remove
                    styles:
                      appearance.native: none
                      appearance.border.style: none
                      appearance.background: none
                      typography.color: color.text.muted
                      typography.color@hover: color.text
                      interaction.cursor: pointer
                      interaction.cursor@disabled: not-allowed
                      appearance.opacity@disabled: 0.5
                      # Its padding (0 0.25rem) is a literal pair the stylesheet
                      # writes.
                      spacing.internal.block.start: 0
                      spacing.internal.block.end: 0
                      spacing.internal.inline.start: 0.25rem
                      spacing.internal.inline.end: 0.25rem
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "0..*"
      relation:
        cardinality: "0..1"
