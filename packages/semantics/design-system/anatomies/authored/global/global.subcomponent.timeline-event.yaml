---
# Authored 2026-09-13 from @canonical/react-ds-global
# src/lib/pattern/Timeline/common/Event/styles.css on .ds.timeline-event and its
# child selectors (> .marker, ::before, > .content and the three content parts).
# The stylesheet corrects the tree: the actor, datetime and payload are children
# of a `.content` wrapper, not of the event, and the event also carries a marker.
node:
  uri: global.subcomponent.timeline-event
  styles:
    layout.type: flex
    layout.direction: row
    # Position relative for the connecting line.
    layout.position: relative
    # The gap reads --timeline-event-gap then --spacing-medium; neither is
    # declared anywhere, so only the literal the chain falls back to is written.
    spacing.gap: 1rem
  edges:
    - node:
        role: marker
        styles:
          layout.flex.shrink: 0
          # --timeline-marker-size is a per-instance override slot with no
          # declaration, so the 12px fallback is what resolves.
          size.width: 12px
          size.height: 12px
          appearance.radius: 50%
          # The primary foreground fills the dot, through the channel that
          # importance provides it on; the criticality classes (.success, .error,
          # .warning, .information) set that channel. The middle rank is reached
          # through --timeline-marker-color, a per-instance override slot with no
          # declaration of its own.
          appearance.background: [modifier.color.foreground.primary, color.border, "#ccc"]
          layout.position: relative
          appearance.border.style: solid
          # --timeline-marker-border-width has no declaration; 2px is the literal
          # the chain falls back to. The border colour reads the modifier channel,
          # then --timeline-marker-border-color (another undeclared override slot)
          # and then --color-surface, which no stratum declares either.
          appearance.border.width: 2px
          appearance.border.color: [modifier.color.border, "#fff"]
          # margin-top reads --timeline-marker-offset, undeclared, and the chain
          # names no token, so the literal it falls back to is written.
          spacing.external.block.start: 0.25rem
          layout.stack: 1
      relation:
        cardinality: "1"
    - node:
        # drawn as ::before
        role: connecting line
        styles:
          layout.position: absolute
          # The line joining one event to the next, and the last event hides it
          # (`:last-child::before { display: none }`) — which is why this edge
          # is 0..1 where a pseudo-element part is otherwise exactly one.
          # --timeline-line-width and --timeline-line-color
          # have no declaration, so the width is the 2px fallback and the colour
          # falls through to the border token.
          size.width: 2px
          appearance.background: [color.border, "#e0e0e0"]
          # Its three offsets (left, top, bottom) are calc()s over the marker
          # size, the marker offset and --timeline-event-spacing, so none is
          # bound.
      relation:
        cardinality: "0..1"
    - node:
        role: content
        styles:
          layout.type: flex
          layout.direction: row
          layout.wrap: wrap
          layout.align: baseline
          layout.flex.grow: 1
          layout.flex.shrink: 1
          layout.flex.basis: 0%
          size.min.width: 0
          # --timeline-content-gap then --spacing-small: neither is declared, so
          # the literal stands. The block-end padding reads
          # --timeline-event-spacing then --spacing-large, also undeclared.
          spacing.gap: 0.5rem
          spacing.internal.block.end: 1.5rem
        edges:
          - node:
              role: actor
              styles:
                # --timeline-actor-font-weight then --font-weight-semibold:
                # neither is declared. --timeline-actor-color then
                # --color-text-primary, also undeclared.
                typography.weight: 600
                typography.color: inherit
            relation:
              cardinality: "0..1"
          - node:
              role: datetime
              styles:
                # --timeline-datetime-font-size then --font-size-small, and
                # --timeline-datetime-color then --color-text-secondary: none of
                # the four is declared, so the literals stand.
                typography.size: 0.875rem
                typography.color: "#666"
            relation:
              cardinality: "0..1"
          - node:
              role: payload
              styles:
                # --timeline-payload-color then --color-text-primary, and
                # --timeline-payload-line-height then --font-line-height-relaxed:
                # none is declared.
                typography.color: inherit
                typography.lineHeight: 1.6
                # Wraps to its own full-width line when the content is long.
                layout.flex.basis: 100%
            relation:
              cardinality: "1"
              slotName: default
      relation:
        cardinality: "1"
        slotName: default
