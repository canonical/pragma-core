---
# Authored 2026-09-13 from @canonical/react-ds-global src/lib/component/KeyboardKey/styles.css on .ds.keyboard-key
# The monospace typography tier (font-family, size, weight, line-height) comes
# from the shared `.code` baseline utility and is deliberately NOT redeclared
# by the component, so this anatomy binds none of it. The key establishes its
# own `.surface`, so the colour reads are on the element and step with nesting.
node:
  uri: global.component.keyboard_key
  styles:
    layout.type: inline-block
    appearance.background: [surface.color.background, color.background]
    typography.color: [surface.color.text, color.text]
    appearance.border.style: solid
    appearance.border.width: dimension.stroke.thickness.medium
    appearance.border.color: color.border.muted
    # Figma asks for 2px; no 2px radius token exists, so the reference stays on
    # radius-small (currently 0) and so does this.
    appearance.radius: dimension.radius.small
    spacing.internal.inline.start: dimension.050   # --keyboard-key-padding-inline
    spacing.internal.inline.end: dimension.050     # --keyboard-key-padding-inline
