---
# TODO implementation: no reference in @canonical/react-ds-global or react-ds-global-form
# The root is an unclipped row: the body, which holds the segments, and beside it the
# remove control. Neither the root nor the body is a button; each segment is its own
# button once scripts run.
# The `unity` property chooses the body: `separated`, the default, where each segment
# carries its own fill and is its own target, or `joined`, where the body carries the fill
# and is the target. The implementation reads each component token first and the value
# bound here as its fallback.
node:
  uri: global.component.segmented_chip
  styles:
    layout.type: inline-flex
    layout.align: center
    # Between the body and the remove control: 8 px, so the body's ring, which reaches 5 px
    # past the body, never draws over the remove control.
    spacing.gap: dimension.100
    typography.font: typography.text.secondary
    typography.whiteSpace: nowrap
  edges:
    - switch:
        on: props
        cases:
          - node:
              # unity: separated. A plain container, never a button. Once scripts run, and
              # when its segments are buttons, it carries role="group", named by the whole
              # clause, each symbol spoken by its segment's label. It paints nothing; each
              # segment carries its own fill.
              role: separated body
              styles:
                layout.type: inline-flex
                layout.align: center
                # The ends of the first and last segments are rounded by clipping the
                # body: it takes the full radius and hides its overflow, because no key
                # sets one corner. --segmented-chip-radius
                appearance.radius: dimension.radius.full
                layout.overflow: hidden
                # --segmented-chip-background
                appearance.background: transparent
                # The dividers carry the separation between segments, so the body sets
                # no gap.
                spacing.gap: 0
                # 24 px, the minimum target size of WCAG 2.5.8.
                # --segmented-chip-min-height
                size.min.height: dimension.300
                # One ring around the clause while focus is within the body, on a
                # segment or on the editor; @focus stands for :focus-within here, which
                # the DSL does not name. The 3 px ring sits 2 px outside the body, so it is
                # drawn against the surface beneath the chip, not the selected fill:
                # 4.96:1 on color.background and 4.67:1 (light) or 5.47:1 (dark) on
                # color.foreground.input, where an inset ring on
                # color.foreground.secondary.active would give 3.04:1 and 2.95:1. It is
                # the selection cue that does not rest on fill alone.
                appearance.outline.style@focus: solid
                appearance.outline.color@focus: color.focusRing
                appearance.outline.width@focus: dimension.stroke.thickness.large
                appearance.outline.offset@focus: dimension.025
              edges:
                - node:
                    uri: global.subcomponent.segmented_chip-segment
                  relation:
                    # Field, operator and value for a filter; one segment for search
                    # text. The dividers sit between consecutive segments; the DSL has
                    # no interleave construct.
                    cardinality: "1..*"
                - node:
                    uri: global.subcomponent.segmented_chip-divider
                  relation:
                    cardinality: "0..*"
          - node:
              # unity: joined. The same container, which carries the fill, the border
              # and the states, so the clause is one target. Its segments paint only
              # the operator's tone and an inner highlight.
              role: joined body
              styles:
                layout.type: inline-flex
                layout.align: center
                appearance.radius: dimension.radius.full
                layout.overflow: hidden
                appearance.background: [modifier.color.foreground.secondary, color.foreground.secondary]
                appearance.background@hover: color.foreground.secondary.hover
                # @selected is drawn from a data attribute, never aria-selected, which a
                # group does not support.
                appearance.background@selected: color.foreground.secondary.active
                # @invalid is drawn from a data attribute set while a segment is invalid,
                # never aria-invalid, which a group does not support.
                appearance.background@invalid: color.foreground.secondary.error
                appearance.background@disabled: color.foreground.secondary.disabled
                appearance.border.style: solid
                appearance.border.width: dimension.stroke.thickness.medium
                # No symbol declares the reference design's border colour.
                # --segmented-chip-border-color
                appearance.border.color: "#c5c5c5"
                appearance.border.color@invalid: color.border.error
                spacing.gap: 0
                spacing.internal.inline.start: dimension.100
                spacing.internal.inline.end: dimension.100
                # 26 px, which no symbol declares.
                size.min.height: 1.625rem
                # The same outside ring as the separated body.
                appearance.outline.style@focus: solid
                appearance.outline.color@focus: color.focusRing
                appearance.outline.width@focus: dimension.stroke.thickness.large
                appearance.outline.offset@focus: dimension.025
              edges:
                - node:
                    uri: global.subcomponent.segmented_chip-segment
                    styles:
                      # Only a Condition or Criticality value paints a segment: the
                      # operator's tone is a patch behind its label.
                      appearance.background: [modifier.color.foreground.secondary, transparent]
                      appearance.background@hover: transparent
                      appearance.background@selected: transparent
                      appearance.background@invalid: transparent
                      appearance.background@disabled: transparent
                      # The inner highlight of a hovered segment has no symbol; nothing
                      # is bound for it until one exists.
                      spacing.internal.inline.start: 0
                      spacing.internal.inline.end: 0
                  relation:
                    cardinality: "1..*"
                - node:
                    uri: global.subcomponent.segmented_chip-divider
                    styles:
                      # A 1 px line as tall as the 24 px minimum, with 6 px on each
                      # side; no symbol declares the colour or the margin. Its @invalid
                      # is the chip's data attribute too: the divider is aria-hidden.
                      size.inline: dimension.stroke.thickness.medium
                      size.block: dimension.300
                      layout.alignSelf: center
                      appearance.background: "#c5c5c5"
                      appearance.background@invalid: color.border.error
                      spacing.external.inline.start: 0.375rem
                      spacing.external.inline.end: 0.375rem
                  relation:
                    cardinality: "0..*"
      relation:
        cardinality: "1"
    - node:
        # Present when the host passes onRemove or removeHref: a native <button>, or a
        # link to removeHref, named by removeLabel. It sits beside the body, outside its
        # clipping, so its focus ring shows whole. Its target is at least 24 by 24 px. On
        # a read-only chip in a roving context it is the chip's roving item.
        role: remove control
        styles:
          layout.type: inline-flex
          layout.align: center
          layout.justify: center
          size.min.width: dimension.300
          size.min.height: dimension.300
          appearance.radius: dimension.radius.full
          # The plain fill, not the modifier channel: the remove control stays neutral on
          # a refused chip, on the fill its icon symbol is paired with.
          appearance.background: color.foreground.secondary
          appearance.background@hover: color.foreground.secondary.hover
          appearance.background@active: color.foreground.secondary.active
          interaction.cursor: pointer
          appearance.outline.style@focus: solid
          appearance.outline.color@focus: [modifier.color.focusRing, color.focusRing]
          appearance.outline.width@focus: dimension.stroke.thickness.large
          appearance.outline.offset@focus: dimension.025
        edges:
          - node:
              uri: global.component.icon
              props:
                icon: close
              styles:
                size.width: dimension.200
                size.height: dimension.200
                typography.color: color.icon.onForegroundSecondary
            relation:
              cardinality: "1"
      relation:
        cardinality: "0..1"
