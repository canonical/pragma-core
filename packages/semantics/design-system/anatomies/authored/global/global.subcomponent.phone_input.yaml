---
# Authored 2026-09-13 from @canonical/react-ds-global-form
# src/lib/subcomponent/PhoneInput/styles.css on .ds.input.phone and its child
# selectors (> .country-select, > .number-input), together with the shared
# `.ds.input.chrome` rule in src/index.css, which the component's own class list
# (`ds input phone chrome`) puts on this same element.
node:
  uri: global.subcomponent.phone_input
  styles:
    # A composite wrapper: two controls share one visual box, so it overrides the
    # chrome's `display: block` and resets its padding.
    layout.type: flex
    layout.align: stretch
    layout.boxSizing: border-box
    size.width: 100%
    spacing.internal.block.start: 0
    spacing.internal.block.end: 0
    spacing.internal.inline.start: 0
    spacing.internal.inline.end: 0
    # ── the shared input chrome (src/index.css, `.ds.input.chrome`) ──────────
    appearance.border.width: dimension.stroke.thickness.medium
    appearance.border.style: solid
    # The base theme is bottom-border-only: `border-color` is set from
    # --form-input-border-color, and then the top, right and left colours are
    # overridden to `transparent` (--form-input-border-color-{top,right,left}),
    # so only the bottom edge paints. The four-side key therefore takes the
    # literal the three overridden sides end at, and the bottom key the token
    # the fourth falls through to.
    appearance.border.color: transparent
    appearance.border.bottom.color: color.border
    # A `.danger` field — a failed validation — repaints the bottom border alone,
    # through --form-input-border-color-bottom.
    appearance.border.bottom.color@invalid: color.border.error
    appearance.radius: dimension.radius.small
    appearance.background: color.foreground.input
    typography.color: color.text
    # The font-family, font-size and line-height facets of the text-primary
    # composite are read (--typography-text-primary-font-family, and its
    # font-size and line-height through --form-input-font-size and
    # --form-input-line-height), so the composite is bound once: typography.size
    # admits dimension.* alone.
    typography.font: typography.text.primary
    motion.property: border-color, box-shadow
    # The hover fill reads --hover--color-foreground-input first, a computed state
    # variable that no stratum declares as a symbol.
    appearance.background@hover: color.foreground.input.hover
    # Focus lights all four edges and drops the user-agent outline for a ring of
    # its own.
    appearance.border.color@focus: color.focusRing
    appearance.outline.style@focus: none
    # A disabled control keeps its border BOX so its height still matches an
    # enabled one, and drops only the paint.
    appearance.background@disabled: color.foreground.input.disabled
    appearance.border.color@disabled: transparent
    interaction.cursor@disabled: not-allowed
    # Not bound, and why:
    # - height reads --form-input-height, a calc() over --space-baseline, which
    #   no stratum declares;
    # - padding-block reads --form-input-padding-block, then
    #   --component-padding-block, neither of which is declared. A density scope
    #   re-derives the INLINE padding (--form-input-padding-inline, from
    #   --density-padding-inline then --space-200) and never padding-block;
    # - the focus ring and the disabled text colour are a box-shadow at
    #   --form-focus-ring-color and a read of --disabled--color-text: no roster
    #   key takes a box-shadow, and the computed state variable is not a symbol;
    # - the transition duration reads --motion-duration-fast, undeclared;
    # - a `.danger` field lights the focus ring at color.focusRing.error, which
    #   needs the compound of invalid and focus that this version of the
    #   notation reserves. Its bottom border is bound above.
  edges:
    - node:
        role: country selector
        styles:
          appearance.native: none
          appearance.border.style: none
          appearance.background: transparent
          typography.color: inherit
          typography.fontFamily: inherit
          typography.whiteSpace: nowrap
          interaction.cursor: pointer
          size.min.width: 5.5rem
          # The separator between the two controls: a border-inline-end at
          # --form-input-border-width. The roster has an inline-end colour key
          # but no inline-end width key, so only the colour is bound.
          appearance.border.inline.end.color: color.border
          # Focus tints the selector with the input hover fill; its first rank,
          # --hover--color-foreground-input, is a computed state variable that no
          # stratum declares as a symbol.
          appearance.background@focus: color.foreground.input.hover
          appearance.outline.style@focus: none
          interaction.cursor@disabled: not-allowed
          # Not bound: padding-inline and padding-inline-end read
          # --form-input-padding-inline / --form-field-inline-gap, then
          # --component-padding-inline / --container-gap-default, none declared;
          # the disabled text colour reads --form-input-color-disabled, i.e. the
          # computed --disabled--color-text; and the disabled separator colour is
          # `transparent`, which the inline-end colour key (token only) cannot
          # take. The `.p` class supplies font-size, line-height and the
          # baseline nudges.
      relation:
        cardinality: "1"
    - node:
        role: number entry
        styles:
          layout.flex.grow: 1
          layout.flex.shrink: 1
          layout.flex.basis: 0%
          size.min.width: 0
          appearance.border.style: none
          appearance.background: transparent
          appearance.outline.style: none
          typography.color: inherit
          typography.fontFamily: inherit
          interaction.cursor@disabled: not-allowed
          # The leaf carries the inline padding (--form-input-padding-inline,
          # then --component-padding-inline: undeclared), and its disabled text
          # colour reads the computed --disabled--color-text.
      relation:
        cardinality: "1"
        slotName: default
