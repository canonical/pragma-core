---
# Authored 2026-09-13 from @canonical/react-ds-global
# src/lib/component/Tile/common/Content/styles.css on .ds.tile-content.
node:
  uri: global.subcomponent.tile-content
  styles:
    layout.type: flex
    layout.direction: column
    # The block padding is deliberately asymmetric so a header above and this
    # section read as one region, which no single spacing role can say; each key
    # binds the dimension its variable reads.
    spacing.gap: dimension.100                    # --tile-content-gap, the block gap between fields
    spacing.internal.block.start: dimension.100   # --tile-content-padding-top
    spacing.internal.block.end: dimension.200     # --tile-content-padding-bottom
    spacing.internal.inline.start: dimension.200  # --tile-content-padding-inline, a surface inset
    spacing.internal.inline.end: dimension.200    # --tile-content-padding-inline, a surface inset
