---
# TODO implementation: no reference — the tier has no implementation to derive from
# The retired root was `global.component.password-constraints`, which names no subject;
# the block's own uri is used instead.
# 1. Container (Root)
node:
  uri: apps_landscape.component.password_constraints
  styles:
    # Structural
    layout.type: flex   # was stack
    # was layout.display: block; layout.type already carries the display type
    layout.direction: column   # was vertical
    # Themeable
    # was spacing.gap: spacing/vertical/small; no spacing symbol corresponds to
    # Vanilla's vertical small step
  edges:
    # 2. Title
    - node:
        role: title label
        styles:
          # was typography.size: font/size/small (.p-text--small); no fontSize symbol
          # corresponds to the small text size
          typography.color: color.text.muted   # was color/text/muted (.u-text--muted)
          # was spacing.margin.bottom: spacing/vertical/small; no spacing symbol
          # corresponds to Vanilla's vertical small step
      relation:
        cardinality: "1"

    # 3. Constraints List
    - node:
        role: constraints list container
        styles:
          layout.type: block   # was layout.display: block
        edges:
          # 4. Constraint Item (Repeating)
          - node:
              role: constraint item
              styles:
                # Structural (from .constraint class)
                layout.type: flex          # was flow
                layout.direction: row   # was horizontal
                layout.align: center       # Maps to align-items: center

                # Themeable
                # was spacing.gap: spacing/small (column-gap: $sph--small); no
                # spacing.small symbol is declared
                # was spacing.margin.bottom: spacing/small (margin-bottom: $spv--small);
                # same

                # Dynamic Appearance (State-based)
                # Maps to .passed, .default, .failed classes. The retired value was the
                # three-way list [color/positive, color/text/muted, color/negative],
                # which is one colour per class and not a fallback order — the DSL's
                # list IS a fallback order, so only the default class's colour is bound
                # here. The passed and failed colours are dropped: `passed` and `failed`
                # are not in the closed state vocabulary.
                typography.color: color.text.muted
              edges:
                # 5. Status Icon
                - node:
                    uri: global.component.icon
                    # was size.width and size.height: size/icon/small; no dimension
                    # symbol corresponds to a small icon
                  relation:
                    cardinality: "1"

                # 6. Constraint Label
                - node:
                    role: label text
                    # was typography.size: font/size/small (.p-text--small); no
                    # fontSize symbol corresponds to the small text size
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "4"   # Fixed at 4 items in the original code
      relation:
        cardinality: "1"
