name: Sync Coda data (scheduled)

on:
  schedule:
    - cron: "0 6 * * *" # Daily at 06:00 UTC

# Reusable-workflow permissions are capped by the caller, so the write grants
# must be declared here too (not only in sync-coda.yml).
permissions:
  contents: write
  issues: write

jobs:
  sync:
    uses: ./.github/workflows/sync-coda.yml
    # The sync job runs in the `sync` environment; a called workflow only receives
    # that environment's secrets when its caller passes secrets on.
    secrets: inherit
    with:
      trigger: Scheduled
      # Scheduled runs never bypass the fail-closed guards; use the manual
      # workflow's allow_shrink input for intentional large deletions.
      allow_shrink: false
      # Malformed upstream rows do not stop the sync: one bad row in the source
      # document would otherwise hold back every other edit. Each row left out is
      # listed in the run summary and in the sync pull request, to be fixed at the
      # source.
      allow_malformed_rows: true
