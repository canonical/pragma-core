name: GitHub Release
description: Creates the GitHub Release for a tag, with notes generated from its commits.
inputs:
  version:
    description: "The released version number (without tag prefix)."
    required: true
  tag_prefix:
    description: "Prefix for the git tag. Default is 'v'."
    required: false
    default: "v"
runs:
  using: composite
  steps:
    - name: Create the release
      shell: bash
      run: ${{ github.action_path }}/release.sh ${{ inputs.version }} ${{ inputs.tag_prefix }}
